[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "action-tracker"
version = "0.1.0"
description = "MCP server that reads meeting notes and saves action items."
requires-python = ">=3.13"
dependencies = [
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
